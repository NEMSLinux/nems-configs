# Redirect /cockpit to /cockpit/
RedirectMatch 301 ^/cockpit$ /cockpit/

<Location /cockpit/>
    # Protect with NEMS SSO (Admin/Superadmin only)
    LuaHookAccessChecker /etc/apache2/nems_sso.lua nems_require_admin

    # Proxy HTTP and auto-upgrade WebSockets directly
    ProxyPass http://127.0.0.1:9090/cockpit/ upgrade=websocket
    ProxyPassReverse http://127.0.0.1:9090/cockpit/
</Location>
