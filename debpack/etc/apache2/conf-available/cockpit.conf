# Redirect /cockpit to /cockpit/
RedirectMatch 301 ^/cockpit$ /cockpit/

<Location /cockpit/>
    # Protect with NEMS SSO (Admin/Superadmin only)
    LuaHookAccessChecker /etc/apache2/nems_sso.lua nems_require_admin

    # Rewrite WebSockets dynamically, then proxy standard HTTP
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:9090/cockpit/$1 [P,L]

    ProxyPass http://127.0.0.1:9090/cockpit/
    ProxyPassReverse http://127.0.0.1:9090/cockpit/
</Location>
